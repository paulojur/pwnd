<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lançador D8 - Copinho</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f13;
            --table-color: #1a1a24;
            --dice-border: #4a4a5a;
            --highlight: #00ffcc;
            --highlight-dim: rgba(0, 255, 204, 0.2);
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap; /* Ajuda no layout horizontal */
        }

        h1 {
            font-size: 1.2rem;
            margin: 1rem 0;
            text-align: center;
            letter-spacing: 2px;
            color: var(--dice-border);
            text-transform: uppercase;
            z-index: 20;
            width: 100%;
        }

        .table-area {
            position: relative;
            width: 100%;
            flex: 1; 
            background: radial-gradient(circle at center, var(--table-color) 0%, var(--bg-color) 70%);
            border-bottom: 2px solid var(--dice-border);
            perspective: 1000px;
            min-height: 250px;
        }

        .bottom-panel {
            height: 35%;
            min-height: 220px;
            max-height: 350px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            box-sizing: border-box;
            position: relative;
        }

        /* RESPONSIVIDADE PARA MODO HORIZONTAL (Paisagem) */
        @media (orientation: landscape) and (max-height: 500px) {
            h1 {
                margin: 5px 0;
                font-size: 1rem;
            }
            .table-area {
                width: 55%;
                height: calc(100vh - 35px);
                flex: none;
                border-bottom: none;
                border-right: 2px solid var(--dice-border);
                min-height: unset;
            }
            .bottom-panel {
                width: 45%;
                height: calc(100vh - 35px);
                flex: none;
                min-height: unset;
                max-height: unset;
                padding: 0.5rem;
                justify-content: center;
            }
            .cup-wrapper {
                bottom: 10px;
            }
            .die {
                bottom: 30px;
            }
            .info-shake {
                display: none; /* Esconde para ganhar espaço de tela */
            }
        }

        .cup-wrapper {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            transform-origin: bottom center;
        }

        .cup {
            width: 100px;
            height: 130px;
            background: linear-gradient(135deg, #2a2a35 0%, #111118 100%);
            border-radius: 10px 10px 30px 30px;
            border: 2px solid var(--dice-border);
            border-top: 15px solid #0a0a0f;
            box-shadow: inset 0 20px 20px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        .cup::after {
            content: 'PWND';
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: #4a4a5a;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .cup-wrapper.shaking {
            animation: shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
        }

        .cup-wrapper.throwing {
            animation: throw 0.6s ease-out forwards;
        }

        @keyframes shake {
            0% { transform: translateX(-50%) rotate(0deg) translateY(0); }
            25% { transform: translateX(-60%) rotate(-15deg) translateY(-10px); }
            50% { transform: translateX(-40%) rotate(15deg) translateY(0); }
            75% { transform: translateX(-60%) rotate(-15deg) translateY(-5px); }
            100% { transform: translateX(-50%) rotate(0deg) translateY(0); }
        }

        @keyframes throw {
            0% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            40% { transform: translateX(-50%) translateY(-150px) rotate(-130deg); }
            80% { transform: translateX(-50%) translateY(-130px) rotate(-130deg); }
            100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
        }

        .die {
            position: absolute;
            width: 90px;
            height: 120px;
            bottom: 40px;
            left: 50%;
            margin-left: -45px;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
        }

        .die svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: filter 0.3s;
        }

        .die-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .die.flying {
            animation: fly-out 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fly-out {
            0% { 
                transform: translate(0, 0) scale(0.3) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--target-x), var(--target-y)) scale(1) rotate(var(--target-rot));
                opacity: 1;
            }
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            z-index: 20;
        }

        button {
            background: transparent;
            border: 2px solid var(--dice-border);
            color: var(--text-color);
            padding: 0.75rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
        }

        button:hover:not(:disabled) {
            border-color: var(--highlight);
            color: var(--highlight);
            box-shadow: 0 0 15px var(--highlight-dim) inset;
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            border-color: var(--highlight);
            color: var(--highlight);
            padding: 1rem 2rem;
            font-size: 1.1rem;
            box-shadow: 0 0 20px var(--highlight-dim);
        }

        .history-container {
            width: 100%;
            max-width: 400px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            align-items: center;
            scrollbar-width: none; 
        }
        .history-container::-webkit-scrollbar {
            display: none;
        }

        .hist-item {
            font-size: 1rem;
            color: #666;
            padding: 0.5rem;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
            width: 90%;
            text-align: center;
            animation: fade-in 0.3s;
        }

        .hist-item:first-child {
            color: #fff;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--dice-border);
            font-size: 1.2rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .hist-item span.number {
            color: var(--highlight);
            font-weight: 800;
            margin: 0 0.2rem;
            font-size: 1.1em;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .permission-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.7rem;
            padding: 4px 8px;
            background: transparent;
            border: 1px solid var(--dice-border);
            color: #666;
            z-index: 50;
        }

        .info-shake {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 1px;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <h1>PWND! Verificação</h1>
    <button id="permBtn" class="permission-btn" onclick="initSensors()">Ativar Sensores</button>
    
    <div class="table-area">
        <div class="cup-wrapper" id="cup">
            <div class="cup"></div>
        </div>

        <div class="die" id="die1">
            <svg viewBox="0 0 100 133" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,0 100,33 50,133 0,33" fill="#1a1a24" stroke="#4a4a5a" stroke-width="1.5" stroke-linejoin="round"/>
                <polygon points="50,0 100,33 50,66" fill="#2a2a35" stroke="#4a4a5a" stroke-width="1.5" stroke-linejoin="round"/>
                <polygon points="50,0 0,33 50,66" fill="#22222d" stroke="#4a4a5a" stroke-width="1.5" stroke-linejoin="round"/>
                <polygon points="50,133 100,33 50,66" fill="#15151e" stroke="#4a4a5a" stroke-width="1.5" stroke-linejoin="round"/>
                <polygon points="50,133 0,33 50,66" fill="#111118" stroke="#4a4a5a" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <div class="die-value" id="val1">8</div>
        </div>

        <div class="die" id="die2">
            <svg viewBox="0 0 100 133" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,0 100,33 50,133 0,33" fill="#1a1a24" stroke="#4a4a5a" stroke-width="1.5" stroke-linejoin="round"/>
                <polygon points="50,0 100,33 50,66" fill="#2a2a35" stroke="#4a4a5a" stroke-width="1.5" stroke-linejoin="round"/>
                <polygon points="50,0 0,33 50,66" fill="#22222d" stroke="#4a4a5a" stroke-width="1.5" stroke-linejoin="round"/>
                <polygon points="50,133 100,33 50,66" fill="#15151e" stroke="#4a4a5a" stroke-width="1.5" stroke-linejoin="round"/>
                <polygon points="50,133 0,33 50,66" fill="#111118" stroke="#4a4a5a" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <div class="die-value" id="val2">8</div>
        </div>
    </div>

    <div class="bottom-panel">
        <div class="controls">
            <button id="btn1" onclick="roll(1)">Rolar 1 Dado</button>
            <button id="btn2" class="btn-primary" onclick="roll(2)">Rolar 2 Dados</button>
        </div>
        
        <div class="history-container" id="history">
            <div class="hist-item" style="opacity: 0.4;">Aguardando jogada...</div>
        </div>

        <div class="info-shake">OU CHACOALHE O CELULAR (2D8)</div>
    </div>

    <script>
        let isRolling = false;
        let rollCounter = 1;
        let wakeLock = null;
        let sensorsEnabled = false;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('WakeLock error:', err);
            }
        }
        
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        function initSensors() {
            if (sensorsEnabled) return;
            requestWakeLock();

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(response => {
                        if (response == 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                            document.getElementById('permBtn').style.display = 'none';
                            sensorsEnabled = true;
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('devicemotion', handleMotion);
                document.getElementById('permBtn').style.display = 'none';
                sensorsEnabled = true;
            }
        }

        document.addEventListener('click', () => {
            if (!sensorsEnabled) initSensors();
        }, {once: true});

        let lastX, lastY, lastZ;
        let shakeThreshold = 22; 

        function handleMotion(e) {
            if (!e.accelerationIncludingGravity) return;
            let acc = e.accelerationIncludingGravity;
            
            if (!lastX) {
                lastX = acc.x; lastY = acc.y; lastZ = acc.z;
                return;
            }
            
            let delta = Math.abs(lastX - acc.x) + Math.abs(lastY - acc.y) + Math.abs(lastZ - acc.z);
            
            if (delta > shakeThreshold && !isRolling) {
                roll(2);
            }
            
            lastX = acc.x; lastY = acc.y; lastZ = acc.z;
        }

        function getRandomValue() {
            return Math.floor(Math.random() * 8) + 1;
        }

        function roll(numDice) {
            if (isRolling) return;
            isRolling = true;
            
            document.getElementById('btn1').disabled = true;
            document.getElementById('btn2').disabled = true;

            const cup = document.getElementById('cup');
            
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

            const dados = [
                { el: document.getElementById('die1'), val: document.getElementById('val1') },
                { el: document.getElementById('die2'), val: document.getElementById('val2') }
            ];

            dados.forEach(d => {
                d.el.classList.remove('flying');
                d.el.style.opacity = '0';
                d.val.style.color = '#fff';
                d.val.style.textShadow = 'none';
                d.el.querySelector('svg').style.filter = 'drop-shadow(0 10px 15px rgba(0,0,0,0.5))';
            });
            
            cup.classList.add('shaking');

            setTimeout(() => {
                cup.classList.remove('shaking');
                cup.classList.add('throwing');

                for (let i = 0; i < numDice; i++) {
                    throwDie(dados[i], i, numDice);
                }

                setTimeout(() => {
                    cup.classList.remove('throwing');
                    
                    if (navigator.vibrate) navigator.vibrate(60);

                    let histHtml = '';
                    if (numDice === 1) {
                        histHtml = `Lance #${rollCounter}: <span class="number">${dados[0].finalVal}</span>`;
                    } else {
                        histHtml = `Lance #${rollCounter}: <span class="number">${dados[0].finalVal}</span> e <span class="number">${dados[1].finalVal}</span>`;
                    }
                    
                    const histContainer = document.getElementById('history');
                    
                    if (rollCounter === 1) histContainer.innerHTML = ''; 
                    
                    histContainer.insertAdjacentHTML('afterbegin', `<div class="hist-item">${histHtml}</div>`);
                    
                    if (histContainer.children.length > 5) {
                        histContainer.lastChild.remove();
                    }
                    
                    rollCounter++;
                    isRolling = false;
                    document.getElementById('btn1').disabled = false;
                    document.getElementById('btn2').disabled = false;

                }, 900);

            }, 700);
        }

        function throwDie(dadoObj, index, totalDices) {
            dadoObj.el.classList.remove('flying');
            void dadoObj.el.offsetWidth; 
            
            // Cálculos dinâmicos com base no tamanho exato da tela do usuário
            const table = document.querySelector('.table-area');
            const tWidth = table.clientWidth;
            const tHeight = table.clientHeight;
            const dieW = 90;
            const dieH = 120;
            
            // Limite X (largura)
            const maxX = (tWidth / 2) - (dieW / 2) - 10;
            let targetX;
            if (totalDices === 1) {
                targetX = (Math.random() * (maxX * 2)) - maxX;
            } else {
                if (index === 0) {
                    targetX = -(Math.random() * (maxX - 10) + 10);
                } else {
                    targetX = (Math.random() * (maxX - 10) + 10);
                }
            }
            
            // Limite Y (altura)
            let maxUp = -(tHeight - dieH - 60); 
            if (maxUp > -20) maxUp = -20; // limite de segurança para telas anãs
            const targetY = (Math.random() * (maxUp + 20) - 20); 
            
            const spins = (Math.floor(Math.random() * 2) + 2) * 360; 
            const wobble = (Math.random() * 20 - 10); 
            const targetRot = (spins + wobble) + 'deg'; 

            dadoObj.el.style.setProperty('--target-x', targetX + 'px');
            dadoObj.el.style.setProperty('--target-y', targetY + 'px');
            dadoObj.el.style.setProperty('--target-rot', targetRot);

            dadoObj.el.classList.add('flying');

            const finalVal = getRandomValue();
            let timer = setInterval(() => {
                dadoObj.val.textContent = getRandomValue();
            }, 50);

            setTimeout(() => {
                clearInterval(timer);
                dadoObj.val.textContent = finalVal;
                dadoObj.finalVal = finalVal;
                
                dadoObj.val.style.color = 'var(--highlight)';
                dadoObj.val.style.textShadow = '0 0 15px var(--highlight-dim)';
                dadoObj.el.querySelector('svg').style.filter = 'drop-shadow(0 0 15px var(--highlight-dim))';

            }, 800);
        }
    </script>
</body>
</html>
